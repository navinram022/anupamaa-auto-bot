name: Anupamaa Daily AutoBot

on:
  schedule:
    # Runs every 20 minutes from 01:00 UTC to 05:00 UTC (6:30 AM to 10:30 AM IST)
    - cron: '*/20 1-5 * * *'
  workflow_dispatch:

jobs:
  anupamaa-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Anupamaa Pipeline (Cloud Mode)
        run: |
          python main.py --cloud
