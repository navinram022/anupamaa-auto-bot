name: Anupamaa Daily AutoBot

on:
  workflow_dispatch:
  schedule:
    # 07:00, 07:15, 07:25 IST (01:30, 01:45, 01:55 UTC)
    - cron: '30,45,55 1 * * *'
    # 07:35, 07:45, 07:55, 08:05, 08:15, 08:25 IST (02:05, 02:15, 02:25, 02:35, 02:45, 02:55 UTC)
    - cron: '5,15,25,35,45,55 2 * * *'
    # 08:35, 08:45, 08:55, 09:05, 09:15, 09:25 IST (03:05, 03:15, 03:25, 03:35, 03:45, 03:55 UTC)
    - cron: '5,15,25,35,45,55 3 * * *'

permissions:
  contents: write

jobs:
  anupamaa-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Anupamaa Pipeline (Cloud Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py --cloud

      - name: Commit and Push Updated Story Archive to Cloud
        run: |
          git config --global user.name "Anupamaa-CloudBot"
          git config --global user.email "bot@anupamaa.auto"
          git add last_run_state.json 04_Daily_Episode_Backups/ || true
          git commit -m "Auto-Save Anupamaa Daily Backup [skip ci]" || exit 0
          git push origin main || git push origin master || true
