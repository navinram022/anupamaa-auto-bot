name: Anupamaa Daily AutoBot

on:
  schedule:
    # Runs every 15 minutes from 01:30 UTC (7:00 AM IST) to 05:30 UTC (11:00 AM IST)
    - cron: '*/15 1-5 * * *'
  workflow_dispatch:

jobs:
  anupamaa-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Anupamaa Pipeline (Cloud Mode)
        run: |
          python main.py --cloud
